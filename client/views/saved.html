<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Saved Posts | DIU Nexus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/home.css">
</head>
<body>
<nav class="navbar">
    <div class="navbar-left">
        <button class="back-btn" onclick="handleBack()" title="Back" style="display:flex;"><i class="fas fa-arrow-left"></i></button>
        <a href="../home.html" class="nav-logo" style="display:flex;align-items:center;gap:6px;"><img src="../assets/icon.svg" alt="NEXUS" style="width:26px;height:26px;flex-shrink:0;filter:drop-shadow(0 2px 4px rgba(10,108,255,0.3));" onerror="this.style.display='none'"><span style="font-weight:800;color:#0A6CFF;margin-left:6px;letter-spacing:0.5px;font-size:1.1rem;">NEXUS</span></a>
        <div class="nav-search" style="position:relative;">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search DIU Nexus" oninput="if(this.value.length>2) window.location.href='../home.html?q='+encodeURIComponent(this.value)">
            <div class="search-dropdown" id="searchDropdown"></div>
        </div>
    </div>
    <div class="navbar-center" id="mainNavCenter">
        <a href="../home.html" class="nav-icon-btn" data-tab="home" title="Home"><i class="fas fa-home"></i></a>
        <a href="groups.html" class="nav-icon-btn" data-tab="groups" title="Groups"><i class="fas fa-users"></i></a>
        <a href="reels.html" class="nav-icon-btn" data-tab="reels" title="Reels"><i class="fas fa-film"></i></a>
        <a href="departments.html" class="nav-icon-btn" data-tab="departments" title="Departments"><i class="fas fa-building"></i></a>
        <a href="events.html" class="nav-icon-btn" data-tab="events" title="Events"><i class="fas fa-calendar-alt"></i></a>
    </div>
    <div class="navbar-right">
        <button class="navbar-action-btn" onclick="window.location.href='messenger.html'" title="Messenger"><i class="fab fa-facebook-messenger"></i></button>
        <button class="navbar-action-btn" onclick="window.location.href='../home.html'" title="Notifications"><i class="fas fa-bell"></i></button>
        <button class="navbar-action-btn" onclick="window.location.href='profile.html'" title="Account"><div class="avatar-placeholder" style="width:32px;height:32px;font-size:0.85rem;border-radius:50%;">?</div></button>
    </div>
</nav>
<script src="../js/config.js"></script>
<script>
function handleBack(){ try{ if(history.length>1 && document.referrer) history.back(); else window.location.href='../home.html'; }catch{ window.location.href='../home.html'; } }
(function(){
  const path=window.location.pathname.toLowerCase();
  document.querySelectorAll('.nav-icon-btn').forEach(btn=>{
    const href=(btn.getAttribute('href')||'').toLowerCase();
    const target=href.split('/').pop().split('?')[0];
    const current=path.split('/').pop().split('?')[0] || 'groups.html';
    btn.classList.toggle('active', target===current);
  });
})();
</script>
<div style="max-width:680px;margin:0 auto;padding:80px 16px 40px;">
    <h2 style="font-weight:800;font-size:1.3rem;margin-bottom:16px;"><i class="fas fa-bookmark" style="color:var(--blue);"></i> Saved Posts</h2>
    <div id="savedContainer"><div style="text-align:center;padding:40px;color:#65676b;"><i class="fas fa-spinner fa-spin fa-2x"></i></div></div>
</div>
<script>
const API = (typeof window.API !== 'undefined' ? window.API : (function(){ var p=window.location.protocol,h=window.location.hostname,po=window.location.port; if(p==='file:') return 'http://localhost:5000/api'; if(h==='localhost'||h==='127.0.0.1'||h===''){ if(po==='5000') return window.location.origin+'/api'; if(!po) return window.location.origin.indexOf('5000')!==-1?window.location.origin+'/api':'http://localhost:5000/api'; return 'http://localhost:5000/api'; } return window.location.origin+'/api'; })());,token=localStorage.getItem('token'),me=JSON.parse(localStorage.getItem('user')||'null');
if(!token) window.location.href='../index.html';
if(localStorage.getItem('darkMode')==='1') document.body.setAttribute('data-theme','dark');
async function apiFetch(p,o={}) { const h={'Content-Type':'application/json','Authorization':`Bearer ${token}`}; return fetch(`${API}${p}`,{...o,headers:h}); }
async function load() {
    const res=await apiFetch('/saved'); const posts=await res.json();
    const el=document.getElementById('savedContainer');
    if(!posts.length){el.innerHTML='<div style="text-align:center;padding:60px;color:#65676b;"><i class="fas fa-bookmark" style="font-size:3rem;opacity:0.3;display:block;margin-bottom:12px;"></i>No saved posts yet.<br><a href="../home.html" style="color:var(--blue);font-weight:600;">Browse feed</a></div>';return;}
    el.innerHTML=posts.map(p=>`<div style="background:var(--surface);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.06);"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;"><div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#0866ff,#0550c1);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;">${(p.fullName||'?')[0].toUpperCase()}</div><div><div style="font-weight:700;font-size:0.9rem;">${p.fullName||'Unknown'}</div><div style="font-size:0.75rem;color:#65676b;">${timeAgo(p.saved_at)}</div></div></div>${p.content?`<div style="font-size:0.92rem;line-height:1.5;margin-bottom:8px;">${p.content}</div>`:''} ${p.mediaUrl&&p.mediaType!=='video'?`<img src="${(window.API_BASE || (function(){var p=window.location.protocol,h=window.location.hostname,po=window.location.port; if(p==='file:') return 'http://localhost:5000'; if(h==='localhost'||h==='127.0.0.1'||h===''){ if(po==='5000') return window.location.origin; if(!po) return window.location.origin.indexOf('5000')!==-1?window.location.origin:'http://localhost:5000'; return 'http://localhost:5000'; } return window.location.origin; })())}${p.mediaUrl}" style="width:100%;border-radius:8px;max-height:280px;object-fit:cover;margin-bottom:8px;">`:''}<button onclick="unsave('${p._id||p.id}',this)" style="background:none;border:1.5px solid #e4e6eb;border-radius:8px;padding:6px 14px;font-family:inherit;font-size:0.82rem;font-weight:600;cursor:pointer;color:#65676b;"><i class="fas fa-bookmark"></i> Unsave</button></div>`).join('');
}
async function unsave(id,btn){ const p=btn.closest('div[style]'); await apiFetch(`/saved/${id}`,{method:'POST'}); p.style.opacity='0.5'; setTimeout(()=>p.remove(),400); }
function timeAgo(d) {
    if(!d) return '';
    let dt = typeof d === 'string' && !d.includes('T') ? d.replace(' ', 'T') + 'Z' : d;
    const s = Math.max(0, (Date.now() - new Date(dt).getTime()) / 1000);
    if(s < 60) return 'Just now';
    if(s < 3600) return Math.floor(s/60) + 'm ago';
    if(s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
}
load();
</script>
</body>
</html>
